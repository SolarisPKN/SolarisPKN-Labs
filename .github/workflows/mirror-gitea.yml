name: Mirror to Gitea

on:
  schedule:
    # Se ejecuta a las 00:00 UTC todos los domingos
    - cron: '0 0 * * 0'
  workflow_dispatch: # Te agrega un botón en GitHub para ejecutarlo a mano si no quieres esperar

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio original
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Clona todo el historial y ramas

      - name: Empujar hacia Gitea
        env:
          TOKEN: ${{ secrets.GITEA_TOKEN }}
          USERNAME: SolarisPKN
          REPO: SolarisPKN/SolarisPKN-Labs # Solo cambia "nombre_del_repo" por el tuyo
        run: |
          # Agrega gitea.com como destino remoto usando tu token
          git remote add gitea https://$USERNAME:$TOKEN@gitea.com/$REPO.git
          
          # Fuerza el push de todas las ramas y etiquetas
          git push gitea --all --force
          git push gitea --tags --force