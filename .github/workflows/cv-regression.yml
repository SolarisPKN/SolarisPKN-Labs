name: Bilingual CV download regression

on:
  pull_request:
    paths:
      - 'src/pages/**/portfolio.astro'
      - 'public/cv*'
      - 'scripts/generate-cvs.py'
      - 'scripts/cv-downloads.test.js'
      - '.github/workflows/cv-regression.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/**/portfolio.astro'
      - 'public/cv*'
      - 'scripts/generate-cvs.py'
      - 'scripts/cv-downloads.test.js'
      - '.github/workflows/cv-regression.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Validate localized URLs and PDF artifacts
        run: node --test scripts/cv-downloads.test.js
