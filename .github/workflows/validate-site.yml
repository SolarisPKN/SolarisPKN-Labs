name: Validate SolarisPKN-Labs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate project catalog
        run: node --test scripts/project-catalog.test.js
      - name: Validate architecture model
        run: node --test scripts/architecture-map.test.js
      - name: Run post editor tests
        run: npm run test:post-editor
      - name: Astro diagnostics
        run: npm run check
      - name: Production build
        run: npm run build
