name: Architecture and public catalog regression
on:
  pull_request:
    paths:
      - 'src/components/Architecture/**'
      - 'src/scripts/architecture-explorer.js'
      - 'src/utils/architecture-map.js'
      - 'src/locales/**/arquitectura.json'
      - 'src/pages/**/arquitectura.astro'
      - 'src/content/projects/**'
      - 'src/components/Projects/ProjectCard.astro'
      - 'src/pages/**/projects/**'
      - 'scripts/architecture-map.test.js'
      - 'scripts/project-catalog.test.js'
      - '.github/workflows/restore-architecture-catalog.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/Architecture/**'
      - 'src/scripts/architecture-explorer.js'
      - 'src/utils/architecture-map.js'
      - 'src/locales/**/arquitectura.json'
      - 'src/pages/**/arquitectura.astro'
      - 'src/content/projects/**'
      - 'src/components/Projects/ProjectCard.astro'
      - 'src/pages/**/projects/**'
      - 'scripts/architecture-map.test.js'
      - 'scripts/project-catalog.test.js'
      - '.github/workflows/restore-architecture-catalog.yml'
permissions:
  contents: read
jobs:
  verify-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check architecture and catalogue JavaScript syntax
        run: |
          node --check src/utils/architecture-map.js
          node --check src/scripts/architecture-explorer.js
      - name: Ensure public catalog and architecture topology are restored
        run: node --test scripts/project-catalog.test.js scripts/architecture-map.test.js
      - name: Astro diagnostics
        run: npm run check
      - name: Build current site including portfolio and blog
        run: npm run build
