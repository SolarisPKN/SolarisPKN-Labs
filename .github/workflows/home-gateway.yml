name: Tech Gaming gateway and site regression

on:
  pull_request:
    paths:
      - 'src/pages/**/index.astro'
      - 'src/pages/**/tech/**'
      - 'src/components/Home/**'
      - 'src/locales/**/gateway.json'
      - 'src/assets/index/**'
      - 'public/_headers'
      - 'src/components/Home/TechPlaylists.astro'
      - 'scripts/home-gateway.test.js'
      - 'scripts/contextual-nav.test.js'
      - 'src/layouts/Layout.astro'
      - 'src/components/Layout/**'
      - 'src/pages/**/gaming/**'
      - 'src/locales/**/gaming.json'
      - 'src/locales/**/common.json'
      - 'src/scripts/layout.js'
      - 'src/scripts/backToTop.js'
      - 'src/styles/global.css'
      - 'src/styles/portfolio.css'
      - 'src/pages/**/portfolio.astro'
      - 'scripts/tech-playlist-feed.test.js'
      - 'src/utils/tech-playlist-feed.js'
      - 'src/worker.js'
      - 'src/locales/**/tech-home.json'
      - '.github/workflows/home-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'src/pages/**/index.astro'
      - 'src/pages/**/tech/**'
      - 'src/components/Home/**'
      - 'src/locales/**/gateway.json'
      - 'src/assets/index/**'
      - 'public/_headers'
      - 'src/components/Home/TechPlaylists.astro'
      - 'scripts/home-gateway.test.js'
      - 'scripts/contextual-nav.test.js'
      - 'src/layouts/Layout.astro'
      - 'src/components/Layout/**'
      - 'src/pages/**/gaming/**'
      - 'src/locales/**/gaming.json'
      - 'src/locales/**/common.json'
      - 'src/scripts/layout.js'
      - 'src/scripts/backToTop.js'
      - 'src/styles/global.css'
      - 'src/styles/portfolio.css'
      - 'src/pages/**/portfolio.astro'
      - 'scripts/tech-playlist-feed.test.js'
      - 'src/utils/tech-playlist-feed.js'
      - 'src/worker.js'
      - 'src/locales/**/tech-home.json'
      - '.github/workflows/home-gateway.yml'

permissions:
  contents: read

jobs:
  verify-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure bilingual gateway, existing Tech landing and original artwork
        run: node --test scripts/home-gateway.test.js
      - name: Contextual navigation and universal back-to-top
        run: node --test scripts/contextual-nav.test.js
      - name: Live public YouTube playlist endpoint
        run: node --test scripts/tech-playlist-feed.test.js
      - name: Recheck recovered architecture and catalog
        run: node --test scripts/project-catalog.test.js scripts/architecture-map.test.js
      - name: Astro diagnostics
        run: npm run check
      - name: Build website
        run: npm run build
