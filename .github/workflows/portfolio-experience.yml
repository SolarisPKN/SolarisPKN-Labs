name: Portfolio experience validation
on:
  pull_request:
    paths:
      - 'src/locales/**/portfolio.json'
      - 'src/assets/portfolio/experience/**'
      - 'src/pages/**/portfolio.astro'
      - 'src/styles/portfolio.css'
      - 'scripts/validate-portfolio-experience.mjs'
      - '.github/workflows/portfolio-experience.yml'
  push:
    branches: [main]
    paths:
      - 'src/locales/**/portfolio.json'
      - 'src/assets/portfolio/experience/**'
      - 'src/pages/**/portfolio.astro'
      - 'src/styles/portfolio.css'
      - 'scripts/validate-portfolio-experience.mjs'
      - '.github/workflows/portfolio-experience.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/validate-portfolio-experience.mjs
      - run: npm run build
