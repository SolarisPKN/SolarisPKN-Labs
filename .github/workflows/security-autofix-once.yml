name: One-time dependency patch regeneration

on:
  push:
    branches:
      - security/oct-2026-hardening
    paths:
      - .github/workflows/security-autofix-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Update vulnerable packages within supported version ranges
        run: |
          npm install 'mermaid@^12.2.0' --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci --ignore-scripts
          npm run check
          npm run build
      - name: Commit dependency patches to security branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: apply npm-supported advisory fixes'
            git push origin HEAD:security/oct-2026-hardening
          fi
