name: Mirror to Launchpad

on:
  schedule:
    # Se ejecuta a las 00:00 UTC todos los domingos
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio original
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar clave SSH
        env:
          SSH_KEY: ${{ secrets.LAUNCHPAD_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Agregar Launchpad a los servidores conocidos para que no pida confirmación
          ssh-keyscan git.launchpad.net >> ~/.ssh/known_hosts

      - name: Empujar hacia Launchpad
        run: |
          # Cambia REPOSITORY_NAME por el nombre que quieres darle en Launchpad
          git remote add launchpad git+ssh://solarispkn@git.launchpad.net/~solarispkn/+git/SolarisPKN-Labs
          git push launchpad --all --force
          git push launchpad --tags --force